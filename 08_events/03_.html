<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!-- // setInterval, clearInterval, setTimeout, clearTimeout -->
    <h1>Chai Aur Javascript </h1>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
</body>
<script>
    const myh1 = document.querySelector('h1')

    const start = document.querySelector('#start').addEventListener('click', () => {
        myh1.textContent = "Chai Aur Biscuit"
        console.log(myh1.textContent);
        
    })

    const changeText = setInterval(start,2000)

    const stop = document.querySelector('#stop').addEventListener('click', () => {
        myh1.textContent = "Text Remain Same"

        console.log(myh1.textContent);

        
        
    })

    clearInterval(changeText) = stop
</script>

</html>
