<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Color Changer </title>
</head>
<body id="main">
    <div class="container">
       <input id="random" type="text" placeholder="Enter The Random Color"><br>
       <button id="btn">BOOM</button>
    </div>
</body>
<script>

    const generate = document.querySelector('#random')
    const button = document.querySelector('#btn')
    const main = document.querySelector('#main')


    button.addEventListener('click',() => {
        main.style.backgroundColor = generate.value;
    })




</script>
</html>
