<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="container1">

            <h1>BMI Calculator</h1>

            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" placeholder="Enter weight">

            <label for="height">Height (cm)</label>
            <input type="number" id="height" placeholder="Enter height">

            <button id="btn">Calculate BMI</button>

            <h2 class="outputContainer">Your BMI </h2>
            <p class="output"></p>
            <p class="category"></p>

        </div>

    </div>

    <!-- <script src="script.js"></script> -->

</body>
<script>
    const weight = document.querySelector('#weight')
    const height = document.querySelector('#height')
    const button = document.querySelector('#btn')
    const output = document.querySelector('.output')
    const category = document.querySelector('.category')
    const myh2 = document.querySelector('.outputContainer')

    button.addEventListener('click', () => {

        myh2.style.display = 'block'
        
        const BMI = (weight.value * 10000) / (height.value * height.value)
        output.textContent = BMI;
        if (BMI > 0 && BMI <= 18.5) {
            category.textContent = "You Are Under Weight Category"
        }
        else if (BMI >= 18.5 && BMI <= 24.9) {
            category.textContent = "You Are Under Normal Weight Category"
        }
        else if (BMI >= 25 && BMI <= 29.9) {
            category.textContent = "You Are Under OverWeight Category"
        }
        else {
            category.textContent = "You Are Under Obese Category"
        }
    })









</script>

</html>
