<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: black;color: white;">
    <ul class="language">
        <li>javascript</li>
    </ul>
</body>
<script>
    const addLanguage = (langName) => {
        const li = document.createElement('li')
        li.innerHTML = `${langName}`
        document.querySelector('.language').appendChild(li)

    }
    addLanguage("Python")
    addLanguage("Typescript")
                        
                 // appendChild() => for attaching the two element

    const addOPtiLanguage = (langName) => {
        const li = document.createElement("li")
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').appendChild(li)
    }
    addOPtiLanguage("Golang")

    // Edit value
    const secLang = document.querySelector('li:nth-child(2)')
    // secLang.innerHTML = "Mojo"
    const newLi = document.createElement("li")
    newLi.textContent = "Mojo"
    secLang.replaceWith(newLi)

    // edit 
    const  firstlang = document.querySelector("li:first-child")
    firstlang.outerHTML = "<li>Rust</li>"

    const lastLang = document.querySelector("li:last-child")
    lastLang.remove()  // for removing the element 

</script>
</html>
