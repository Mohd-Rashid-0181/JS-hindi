<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Practice</title>

    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .main{
            width: 350px;
            background: white;
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
            text-align: center;
        }

        .para{
            margin-bottom: 20px;
            font-size: 20px;
            color: #333;
        }

        button{
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: 1px solid #333;
            background: #333;
            color: white;
            border-radius: 4px;
        }

        button:hover{
            background: #555;
        }
    </style>
</head>
<body>

    <div class="main">
        <p class="para">Click the button</p>
        <button id="btn">Generate</button>
    </div>

    <script src="test.js">
    </script>

</body>
</html>
